5/1/1~2025/12/31 所獲得的街口幣，將於 2026/5/31 到期...以此類推）\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cspan style=\"font-size: 10pt; font-family: 'pingfang tc';\"\u003e \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"text-align: justify;\"\u003e\u003cspan style=\"font-size: 10pt; font-family: 'pingfang tc';\"\u003e辦理退款時，將全額回收此筆街口幣回饋再進行退款（遇部分退款時，則會按照退款比例回收），倘若剩餘的現金與街口幣不足時，則會從退款金額中扣除後再返還剩餘之退款金額。 \u003c/span\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan style=\"font-size: 10pt; font-family: 'pingfang tc';\"\u003e若退款金額皆不足扣除現金與街口幣回饋時，則無法退款。\u003c/span\u003e\u003cspan style=\"--tw-border-spacing-x: 0; --tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-scroll-snap-strictness: proximity; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgba(107,186,255,.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; background-repeat: no-repeat; box-sizing: border-box; font-size: 10pt; font-family: 'pingfang tc';\"\u003e\u003cbr /\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan style=\"font-size: 10pt; font-family: 'pingfang tc';\"\u003e\u003cspan style=\"font-family: pingfang tc;\"\u003e\u003cspan style=\"font-size: 13.3333px;\"\u003e使用街口券消費時，無法進行部分退款。若將訂單退款，需等通路確實完成退款(請至App內交易紀錄查看)，且於活動期間與折抵名額內再次交易始能重新享有回饋。\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli style=\"text-align: justify;\"\u003e\u003cspan style=\"white-space: pre-wrap; font-size: 10pt; font-family: 'pingfang tc';\"\u003e若成功辦理退款，交易使用「銀行帳戶」付款者，退款金額將退回至街口帳戶（銀牌會員以上可再提領回銀行帳戶免手續費）；若交易使用「信用卡」付款者，退款金額刷退回原卡。\u003cbr /\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"text-align: justify;\"\u003e\u003cspan style=\"white-space: pre-wrap; font-size: 10pt; font-family: 'pingfang tc';\"\u003e本活動需於活動時間內完成手機付款方可享有（活動時間以台灣標準時間為主），活動最終回饋金額，以系統認列為主，恕無法超過時間要求補償。\u003cbr /\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"text-align: justify;\"\u003e\u003cspan style=\"white-space: pre-wrap; font-size: 10pt; font-family: 'pingfang tc';\"\u003e本活動若發現有交易異常行為（包括但不限於單筆消費拆單付款、頻繁或不正常退款），以致有影響店家正常交易流程或活動公正性之虞者，店家及街口支付有權拒絕拆單並取消回饋資格；街口支付並有權暫停該電子支付帳戶之使用，以確保用戶交易安全。\u003cbr /\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"text-align: justify;\"\u003e\u003cspan style=\"white-space: pre-wrap; font-size: 10pt; font-family: 'pingfang tc';\"\u003e本活動資格辦法以公佈於【街口支付】App上的資料與「街口合作品牌」規定為準，其他未盡事宜，悉依【街口支付】App與「街口合作品牌」規定辦理。【街口支付】App與「街口合作品牌」有權決定取消、終止、修改或暫停所有活動，亦有權對本活動之所有事項做出最終解釋，無須另行通知。\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"18:T613,"])</script><script>self.__next_f.push([1,"\u003cul style=\"color: #323333;\"\u003e\n\u003cli style=\"letter-spacing: 0.06em; margin-bottom: 12px;\"\u003e\u003cspan style=\"letter-spacing: 0.96px; white-space-collapse: preserve; font-family: 'pingfang tc';\"\u003e\u003cspan style=\"color: #e6090f;\"\u003e\u003cspan style=\"color: #323333;\"\u003e\u003cspan style=\"letter-spacing: 0.96px; white-space-collapse: preserve;\"\u003e\u003cspan style=\"letter-spacing: 0.96px; white-space-collapse: preserve;\"\u003e若選擇使用\u003cstrong\u003e「華南銀行帳戶」\u003c/strong\u003e 付款，於活動頁面進行登記，享全通路筆筆 \u003cstrong\u003e\u003cspan style=\"color: #c9191d;\"\u003e10%\u003c/span\u003e\u003c/strong\u003e 街口幣回饋！\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"color: #c9191d;\"\u003e\u003cspan style=\"letter-spacing: 0.96px; white-space-collapse: preserve;\"\u003e（\u003c/span\u003e\u003ca style=\"font-size: 10pt; color: #c9191d;\" href=\"https://mkt.jkopay.com/zh-TW/campaign/hncb\"\u003e查看說明\u003c/a\u003e\u003cspan style=\"letter-spacing: 0.96px; white-space-collapse: preserve;\"\u003e）\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"letter-spacing: 0.06em; margin-bottom: 12px;\"\u003e\u003cspan style=\"f
