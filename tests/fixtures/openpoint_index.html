\u003d\"color: rgb(206, 0, 0); font-size: 18px;\"\u003e二、如何於門市進行折抵\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style\u003d\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e\u003cspan style\u003d\"font-size: 18px;\"\u003e使用點數折抵請主動告知門市職員，並出示OPENPOINT APP的「\u003cu\u003e\u003cspan style\u003d\"background-color: rgb(250, 197, 28);\"\u003e點數折抵條碼\u003c/span\u003e\u003c/u\u003e」\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style\u003d\"color: rgb(0, 0, 0);\"\u003e\u003cstrong\u003e\u003cspan style\u003d\"font-size: 18px;\"\u003e(路徑：APP首頁\u0026gt;右上方會員條碼\u0026gt;點數折抵7-ELEVEN專用)\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src\u003d\"https://redeem.openpoint.com.tw/CDNData/HtmlEditor/Banner/202602/10-115635-623-1065465a-80df-413e-a991-402f3429993d.jpg\" style\u003d\"width: 300px;\" class\u003d\"fr-fic fr-dib fr-fil\"\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan style\u003d\"color: rgb(243, 121, 52); font-size: 18px;\"\u003e\u003cstrong\u003e\u003cspan style\u003d\"color: rgb(206, 0, 0); font-size: 18px;\"\u003e三、注意事項\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e除上述公告範圍，其餘代收項目目前尚不開放，詳情以統一超商系統紀錄為準\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e各支付工具可支付代收項目\u003c/strong\u003e\u003ca href\u003d\"https://www.7-11.com.tw/service/monthly.aspx\" onclick\u003d\"window.OpOpenWeb(false,\u0027https://www.7-11.com.tw/service/monthly.aspx\u0027 , \u00271\u0027);return false;\"\u003e\u003cstrong\u003e\u003cu\u003e請點此\u003c/u\u003e\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e參考\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style\u003d\"font-size: 18px;\"\u003e\u003cstrong\u003eEC取貨付款於門市\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e使用點數折抵後，若後續於網購平台進行退貨，將不退還OPENPOINT點數給您，請特別注意\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e當交易同時包含一般商品及代收，點數折抵順序：一般商品\u0026gt;代收手續費\u0026gt;代收金額\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e\u003cstrong\u003e含有手續費的代收項目，若採部分點數折抵，則剩餘的代收金額僅能以現金進行繳納\u003c/strong\u003e\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e本公司保有隨時修正、暫停或終止本活動之權利，若有未盡事宜，悉依本公司之相關公告辦理\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e若您有任何門市點數折抵問題， 請洽門市職員或OPENPOINT客服(0800-711-177)\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e",
